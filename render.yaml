services:
  - type: web
    name: connectai-downloads
    runtime: static
    buildCommand: echo "Publishing ConnectAI download page"
    staticPublishPath: ./website
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
